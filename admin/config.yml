# Backend configuration - connects to your GitHub repo via Netlify OAuth
backend:
  name: github
  repo: christopherutom71-fullstack/MOZEEZ-Gadgets-Hub
  branch: main

# Where uploaded images are stored
media_folder: "Assets/uploads"
public_folder: "/Assets/uploads"

# Collections - this defines what content the CMS manages
collections:
  - name: "products"
    label: "Products"
    files:
      - name: "all_products"
        label: "All Products"
        file: "_data/products.json"
        fields:
          - name: "products"
            label: "Products"
            label_singular: "Product"
            widget: "list"
            summary: "{{fields.name}} – {{fields.price}}"
            fields:
              - { label: "Name", name: "name", widget: "string", required: true }
              - { label: "Brand", name: "brand", widget: "string" }
              - { label: "Price", name: "price", widget: "string", required: true }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Specifications", name: "specs", widget: "list",
                  field: { label: "Spec", name: "spec", widget: "string" } }
              - { label: "Featured Image", name: "image", widget: "image" }
              - { label: "Category", name: "category", widget: "select",
                  options: ["laptops", "phones", "accessories"] }
              - { label: "In Stock", name: "in_stock", widget: "boolean", default: true }